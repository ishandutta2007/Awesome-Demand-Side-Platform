<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <style>
      .pulse-circle {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      .wave-line {
        stroke-dasharray: 1000;
        stroke-dashoffset: 1000;
        animation: dash 8s linear infinite;
      }
      .float-pill {
        animation: float 6s ease-in-out infinite alternate;
      }
      @keyframes pulse {
        0% { transform: scale(1); opacity: 0.3; }
        100% { transform: scale(1.15); opacity: 0.7; }
      }
      @keyframes dash {
        to { stroke-dashoffset: 0; }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-12px); }
      }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="340" fill="url(#bgGrad)" rx="16"/>

  <!-- Dynamic Dynamic & Graphic Background Elements (Kept faint and out of text path) -->
  <g stroke="#38bdf8" stroke-opacity="0.1" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="340"/>
    <line x1="300" y1="0" x2="300" y2="340"/>
    <line x1="500" y1="0" x2="500" y2="340"/>
    <line x1="700" y1="0" x2="700" y2="340"/>
    <line x1="900" y1="0" x2="900" y2="340"/>
    <line x1="1100" y1="0" x2="1100" y2="340"/>
  </g>

  <!-- Animated Background Orbs -->
  <circle cx="150" cy="80" r="90" fill="#3b82f6" opacity="0.15" class="pulse-circle"/>
  <circle cx="1050" cy="260" r="110" fill="#8b5cf6" opacity="0.15" class="pulse-circle" style="animation-delay: 2s;"/>

  <!-- Dynamic Pulsing Bid Graph Wave (Bottom subtle area) -->
  <path d="M 50 280 Q 200 220 350 260 T 650 230 T 950 270 T 1150 220" fill="none" stroke="url(#textGrad)" stroke-width="3" opacity="0.4" class="wave-line"/>

  <!-- Decorative Pills in Corners (Non-overlapping) -->
  <g class="float-pill" opacity="0.75">
    <rect x="50" y="40" width="140" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="120" y="61" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">⚡ Real-Time Bidding</text>
  </g>
  
  <g class="float-pill" opacity="0.75" style="animation-delay: 3s;">
    <rect x="1000" y="40" width="150" height="32" rx="16" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
    <text x="1075" y="61" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">📡 OpenRTB Protocol</text>
  </g>

  <!-- Foreground Title and Subtitle (Ensured high contrast and complete visibility) -->
  <text x="600" y="145" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" text-anchor="middle" filter="url(#glow)">
    Awesome Demand-Side Platform
  </text>
  
  <text x="600" y="195" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" text-anchor="middle" opacity="0.95">
    Curated List of SaaS Platforms &amp; Open-Source Projects for AdTech &amp; RTB
  </text>

  <!-- Feature Badges Row (Bottom Foreground) -->
  <g transform="translate(370, 240)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="130" height="30" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="65" y="19" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🎯 DSP Buying</text>
    
    <!-- Badge 2 -->
    <rect x="160" y="0" width="130" height="30" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="225" y="19" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">📊 Programmatic</text>
    
    <!-- Badge 3 -->
    <rect x="320" y="0" width="130" height="30" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="385" y="19" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🚀 Ad Infrastructure</text>
  </g>
</svg>
